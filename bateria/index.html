<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title>Batería: cómo elegir un ritmo para una canción | Bases de la Música</title>

  <style>
    :root {
      --fondo: #f5efe3;
      --azul: #14243f;
      --crema: #fff6df;
      --dorado: #c59a45;
      --texto: #18213b;
      --borde: rgba(20, 36, 63, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 8px 8px 28px;
    }

    .reader-bar {
      position: sticky;
      top: 0;
      z-index: 999;
      width: 100%;
      max-width: 820px;
      margin: 0 auto 10px;
      background: var(--azul);
      color: var(--crema);
      border: 1px solid rgba(197,154,69,0.45);
      border-radius: 999px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      box-shadow: 0 8px 24px rgba(20,36,63,0.24);
    }

    .reader-bar button {
      border: 1px solid rgba(197,154,69,0.45);
      background: transparent;
      color: var(--crema);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .reader-bar button:hover {
      background: rgba(255,246,223,0.10);
    }

    .reader-bar button.primary {
      background: var(--crema);
      color: var(--azul);
      border-color: var(--crema);
    }

    .reader-bar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Flechas visibles */
    #prev,
    #next {
      width: 46px;
      height: 38px;
      padding: 0;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-info {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .viewer {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 8px;
      background: rgba(255,250,240,0.85);
      border: 1px solid var(--borde);
      border-radius: 18px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      /* Native one-finger scrolling; two-finger zoom handled by the reader. */
      touch-action: pan-x pan-y;
      overscroll-behavior: contain;
      box-shadow: 0 10px 28px rgba(20,36,63,0.10);
    }

    .canvas-wrap {
      min-width: max-content;
      text-align: center;
      position: relative;
    }

    #link-layer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    #link-layer a {
      position: absolute;
      display: block;
      pointer-events: auto;
      background: transparent;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.16);
    }

    .message {
      padding: 28px 14px;
      text-align: center;
      color: var(--azul);
      font-weight: 700;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .app {
        padding: 6px 4px 24px;
      }

      .reader-bar {
        border-radius: 18px;
        gap: 4px;
        padding: 7px 6px;
      }

      .reader-bar button {
        padding: 7px 8px;
        font-size: 10.5px;
      }

      #prev,
      #next {
        width: 48px;
        height: 40px;
        font-size: 26px;
      }

      .page-info {
        font-size: 11px;
      }

      .viewer {
        padding: 4px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="reader-bar" aria-label="Controles del lector">
      <button id="prev" aria-label="Página anterior">←</button>

      <span class="page-info">
        <span id="page_num">1</span> / <span id="page_count">...</span>
      </span>

      <button id="next" aria-label="Página siguiente">→</button>

      <button id="fullBtn">Pantalla</button>
      <button id="exitBtn" class="primary">Salir</button>
    </section>

    <section class="viewer" id="viewer" aria-label="Página del libro. En pantalla táctil, amplía o reduce usando dos dedos.">
      <div class="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
        <div id="link-layer"></div>
      </div>
    </section>

  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const pdfFileName = 'bateria-como-elegir-un-ritmo-para-una-cancion.pdf';
    const url = pdfFileName + '?v=1';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;

    let currentScale = 1;
    let zoomLevel = 1;
    let renderedZoomLevel = 1;
    let pinch = null;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 4;
    const MAX_RENDER_PIXELS = 14000000;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const viewer = document.getElementById('viewer');
    const linkLayer = document.getElementById('link-layer');

    const pageNumEl = document.getElementById('page_num');
    const pageCountEl = document.getElementById('page_count');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const canvasWrap = document.querySelector('.canvas-wrap');

    function calculateFitScale(page) {
      const baseViewport = page.getViewport({ scale: 1 });
      const availableWidth = viewer.clientWidth - 10;
      return availableWidth / baseViewport.width;
    }

    function updateButtons() {
      prevBtn.disabled = pageNum <= 1;
      nextBtn.disabled = pdfDoc && pageNum >= pdfDoc.numPages;
    }

    function renderPage(num) {
      pageRendering = true;
      const targetZoomLevel = zoomLevel;

      pdfDoc.getPage(num).then((page) => {
        const fitScale = calculateFitScale(page);

        currentScale = fitScale * targetZoomLevel;

        const viewport = page.getViewport({ scale: currentScale });
        // Avoid oversized canvas bitmaps on high-DPI devices.
        const dpr = window.devicePixelRatio || 1;
        const maxOutputScale = Math.sqrt(MAX_RENDER_PIXELS / (viewport.width * viewport.height));
        const outputScale = Math.min(dpr, maxOutputScale);

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';
        canvas.dataset.renderWidth = String(Math.floor(viewport.width));
        canvas.dataset.renderHeight = String(Math.floor(viewport.height));
        canvasWrap.style.width = Math.floor(viewport.width) + 'px';
        canvasWrap.style.height = Math.floor(viewport.height) + 'px';
        linkLayer.style.transform = 'none';

        linkLayer.innerHTML = '';
        linkLayer.style.width = Math.floor(viewport.width) + 'px';
        linkLayer.style.height = Math.floor(viewport.height) + 'px';
        linkLayer.style.left = '0';
        linkLayer.style.transformOrigin = 'top left';

        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderContext).promise.then(() => {
          page.getAnnotations({ intent: 'display' }).then((annotations) => {
            linkLayer.innerHTML = '';

            annotations.forEach((annotation) => {
              if (!annotation.url) return;

              const rect = viewport.convertToViewportRectangle(annotation.rect);
              const left = Math.min(rect[0], rect[2]);
              const top = Math.min(rect[1], rect[3]);
              const width = Math.abs(rect[0] - rect[2]);
              const height = Math.abs(rect[1] - rect[3]);

              const link = document.createElement('a');

              link.href = annotation.url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';

              link.style.left = left + 'px';
              link.style.top = top + 'px';
              link.style.width = width + 'px';
              link.style.height = height + 'px';

              linkLayer.appendChild(link);
            });

            renderedZoomLevel = targetZoomLevel;
            pageRendering = false;

            if (pageNumPending !== null) {
              const pendingPage = pageNumPending;
              pageNumPending = null;
              renderPage(pendingPage);
            } else if (Math.abs(zoomLevel - renderedZoomLevel) > 0.001 && !pinch) {
              renderPage(pageNum);
            }
          });
        });

        pageNumEl.textContent = num;
        updateButtons();
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function previousPage() {
      if (pageNum <= 1) return;

      pageNum--;
      viewer.scrollLeft = 0;
      viewer.scrollTop = 0;

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

      queueRenderPage(pageNum);
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;

      pageNum++;
      viewer.scrollLeft = 0;
      viewer.scrollTop = 0;

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

      queueRenderPage(pageNum);
    }

    function touchDistance(touches) {
      return Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );
    }

    function touchCenter(touches) {
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    function beginPinch(event) {
      if (!pdfDoc || pageRendering || !canvas.dataset.renderWidth || event.touches.length !== 2) return;
      const center = touchCenter(event.touches);
      const box = viewer.getBoundingClientRect();
      pinch = {
        distance: touchDistance(event.touches),
        zoom: zoomLevel,
        scrollLeft: viewer.scrollLeft,
        scrollTop: viewer.scrollTop,
        x: center.x - box.left,
        y: center.y - box.top
      };
      event.preventDefault();
    }

    function previewPinch() {
      // Stretch the current page while fingers move; rerender crisply on release.
      const ratio = zoomLevel / renderedZoomLevel;
      // Use the displayed size instead of the bitmap resolution.
      const baseWidth = parseFloat(canvas.dataset.renderWidth || canvas.style.width);
      const baseHeight = parseFloat(canvas.dataset.renderHeight || canvas.style.height);
      const width = baseWidth * ratio;
      const height = baseHeight * ratio;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvasWrap.style.width = width + 'px';
      canvasWrap.style.height = height + 'px';
      linkLayer.style.transform = 'scale(' + ratio + ')';
    }

    viewer.addEventListener('touchstart', beginPinch, { passive: false });

    viewer.addEventListener('touchmove', (event) => {
      if (!pinch || event.touches.length !== 2) return;
      event.preventDefault();
      const distance = touchDistance(event.touches);
      if (!pinch.distance) return;
      zoomLevel = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM,
        pinch.zoom * distance / pinch.distance));
      previewPinch();
      const ratio = zoomLevel / pinch.zoom;
      viewer.scrollLeft = (pinch.scrollLeft + pinch.x) * ratio - pinch.x;
      viewer.scrollTop = (pinch.scrollTop + pinch.y) * ratio - pinch.y;
    }, { passive: false });

    function endPinch(event) {
      if (!pinch || event.touches.length >= 2) return;
      pinch = null;
      queueRenderPage(pageNum);
    }
    viewer.addEventListener('touchend', endPinch, { passive: true });
    viewer.addEventListener('touchcancel', endPinch, { passive: true });

    function toggleFullScreen() {
      const root = document.documentElement;

      if (!document.fullscreenElement) {
        root.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function exitReader() {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
        return;
      }
      // Activated by a genuine click. Navigate the parent, not only the iframe.
      try {
        window.top.location.assign('https://basesdelamusica.com/#guia-gratuita');
      } catch (_) {
        window.open('https://basesdelamusica.com/#guia-gratuita', '_blank', 'noopener');
      }
    }

    prevBtn.addEventListener(
      'click',
      previousPage
    );

    nextBtn.addEventListener(
      'click',
      nextPage
    );


    document
      .getElementById('fullBtn')
      .addEventListener(
        'click',
        toggleFullScreen
      );

    document
      .getElementById('exitBtn')
      .addEventListener(
        'click',
        exitReader
      );

    document.addEventListener(
      'fullscreenchange',
      () => {
        setTimeout(() => {
          if (pdfDoc) {
            queueRenderPage(pageNum);
          }
        }, 250);
      }
    );

    window.addEventListener(
      'resize',
      () => {
        if (pdfDoc) {
          queueRenderPage(pageNum);
        }
      }
    );

    pdfjsLib
      .getDocument(url)
      .promise
      .then((pdfDoc_) => {
        pdfDoc = pdfDoc_;

        pageCountEl.textContent =
          pdfDoc.numPages;

        renderPage(pageNum);
      })
      .catch(() => {
        viewer.innerHTML =
          '<p class="message">No se pudo cargar el libro. Comprueba que el PDF esté en la misma carpeta que index.html y se llame: ' + pdfFileName + '</p>';
      });
  </script>
</body>
</html>
