<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title>Lector PDF | Bases de la Música</title>

  <style>
    :root {
      --fondo: #f5efe3;
      --azul: #14243f;
      --crema: #fff6df;
      --dorado: #c59a45;
      --texto: #18213b;
      --borde: rgba(20, 36, 63, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 8px 8px 28px;
    }

    .reader-bar {
      position: sticky;
      top: 0;
      z-index: 999;
      width: 100%;
      max-width: 820px;
      margin: 0 auto 10px;
      background: var(--azul);
      color: var(--crema);
      border: 1px solid rgba(197,154,69,0.45);
      border-radius: 999px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
      box-shadow: 0 8px 24px rgba(20,36,63,0.24);
    }

    .reader-bar button {
      border: 1px solid rgba(197,154,69,0.45);
      background: transparent;
      color: var(--crema);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .reader-bar button:hover {
      background: rgba(255,246,223,0.10);
    }

    .reader-bar button.primary {
      background: var(--crema);
      color: var(--azul);
      border-color: var(--crema);
    }

    .reader-bar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Flechas visibles */
    #prev,
    #next {
      width: 46px;
      height: 38px;
      padding: 0;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Botones de zoom grandes */
   /* Botones de zoom */
.zoom-symbol {
  width: 46px;
  height: 42px;
  padding: 0 !important;
  font-size: 27px !important;
  font-weight: 900 !important;
  line-height: 1 !important;
  border-radius: 15px !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--crema) !important;
  color: var(--azul) !important;
  border-color: var(--crema) !important;
}

.zoom-symbol:hover {
  background: #ffffff !important;
}

    .zoom-symbol:hover {
      background: #ffffff !important;
    }

    .page-info {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .viewer {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 8px;
      background: rgba(255,250,240,0.85);
      border: 1px solid var(--borde);
      border-radius: 18px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 10px 28px rgba(20,36,63,0.10);
    }

    .canvas-wrap {
      min-width: max-content;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.16);
    }

    .message {
      padding: 28px 14px;
      text-align: center;
      color: var(--azul);
      font-weight: 700;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .app {
        padding: 6px 4px 24px;
      }
.reader-bar {
  border-radius: 18px;
  gap: 4px;
  padding: 7px 6px;
}

      .reader-bar button {
  padding: 7px 8px;
  font-size: 10.5px;
}

      #prev,
      #next {
        width: 48px;
        height: 40px;
        font-size: 26px;
      }

      .zoom-symbol {
  width: 44px;
  height: 42px;
  font-size: 27px !important;
  border-radius: 14px !important;
}

      .page-info {
        font-size: 11px;
      }

      .viewer {
        padding: 4px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="reader-bar">
      <button id="prev">←</button>

      <span class="page-info">
        <span id="page_num">1</span> / <span id="page_count">...</span>
      </span>

      <button id="next">→</button>

      <button id="zoomOut" class="zoom-symbol" type="button" title="Alejar">−</button>
      <button id="zoomIn" class="zoom-symbol" type="button" title="Acercar">+</button>

      <button id="fullBtn">Pantalla</button>
      <button id="exitBtn" class="primary">Salir</button>
    </section>

    <section class="viewer" id="viewer">
      <div class="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </section>

  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const url = 'que-acorde-viene-despues.pdf?v=1';
   const exitUrl = 'https://basesdelamusica.com/';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;

    let currentScale = 1;
    let zoomLevel = 1;

    const ZOOM_STEP = 0.25;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const viewer = document.getElementById('viewer');

    const pageNumEl = document.getElementById('page_num');
    const pageCountEl = document.getElementById('page_count');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const zoomOutBtn = document.getElementById('zoomOut');
    const zoomInBtn = document.getElementById('zoomIn');

    function calculateFitScale(page) {
      const baseViewport = page.getViewport({ scale: 1 });
      const availableWidth = viewer.clientWidth - 10;
      return availableWidth / baseViewport.width;
    }

    function updateButtons() {
      prevBtn.disabled = pageNum <= 1;
      nextBtn.disabled = pdfDoc && pageNum >= pdfDoc.numPages;

      zoomOutBtn.disabled = zoomLevel <= MIN_ZOOM;
      zoomInBtn.disabled = zoomLevel >= MAX_ZOOM;
    }

    function renderPage(num) {
      pageRendering = true;

      pdfDoc.getPage(num).then((page) => {
        const fitScale = calculateFitScale(page);

        currentScale = fitScale * zoomLevel;

        const viewport = page.getViewport({ scale: currentScale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderContext).promise.then(() => {
          pageRendering = false;

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        pageNumEl.textContent = num;
        updateButtons();
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function previousPage() {
      if (pageNum <= 1) return;
      pageNum--;
      viewer.scrollLeft = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      queueRenderPage(pageNum);
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      viewer.scrollLeft = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      queueRenderPage(pageNum);
    }

    function zoomIn() {
      zoomLevel = Math.min(MAX_ZOOM, zoomLevel + ZOOM_STEP);
      viewer.scrollLeft = 0;
      queueRenderPage(pageNum);
      updateButtons();
    }

    function zoomOut() {
      zoomLevel = Math.max(MIN_ZOOM, zoomLevel - ZOOM_STEP);
      viewer.scrollLeft = 0;
      queueRenderPage(pageNum);
      updateButtons();
    }

    function toggleFullScreen() {
      const root = document.documentElement;

      if (!document.fullscreenElement) {
        root.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function exitReader() {
      try {
        window.top.location.href = exitUrl;
      } catch (error) {
        window.location.href = exitUrl;
      }
    }

    prevBtn.addEventListener('click', previousPage);
    nextBtn.addEventListener('click', nextPage);
    zoomInBtn.addEventListener('click', zoomIn);
    zoomOutBtn.addEventListener('click', zoomOut);

    document.getElementById('fullBtn').addEventListener('click', toggleFullScreen);
    document.getElementById('exitBtn').addEventListener('click', exitReader);

    document.addEventListener('fullscreenchange', () => {
      setTimeout(() => {
        if (pdfDoc) queueRenderPage(pageNum);
      }, 250);
    });

    window.addEventListener('resize', () => {
      if (pdfDoc) {
        queueRenderPage(pageNum);
      }
    });

    pdfjsLib.getDocument(url).promise.then((pdfDoc_) => {
      pdfDoc = pdfDoc_;
      pageCountEl.textContent = pdfDoc.numPages;
      renderPage(pageNum);
    }).catch(() => {
     viewer.innerHTML =
  '<p class="message">No se pudo cargar el PDF. Revisa que el archivo se llame exactamente: que-acorde-viene-despues.pdf</p>';
    });
  </script>
</body>
</html>
