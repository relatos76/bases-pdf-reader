<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lector PDF | Bases de la Música</title>

  <style>
    :root {
      --fondo: #f5efe3;
      --azul: #14243f;
      --crema: #fff6df;
      --dorado: #c59a45;
      --texto: #18213b;
      --borde: rgba(20, 36, 63, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 8px 8px 78px;
    }

    .viewer {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 8px;
      background: rgba(255,250,240,0.85);
      border: 1px solid var(--borde);
      border-radius: 18px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 10px 28px rgba(20,36,63,0.10);
    }

    .canvas-wrap {
      min-width: max-content;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.16);
    }

    .mini-controls {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 999;
      width: calc(100% - 20px);
      max-width: 560px;
      background: var(--azul);
      color: var(--crema);
      border: 1px solid rgba(197,154,69,0.45);
      border-radius: 999px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(20,36,63,0.28);
    }

    .mini-controls button {
      border: 1px solid rgba(197,154,69,0.45);
      background: transparent;
      color: var(--crema);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-controls button:hover {
      background: rgba(255,246,223,0.10);
    }

    .mini-controls button.salir {
      background: var(--crema);
      color: var(--azul);
      border-color: var(--crema);
    }

    .page-info {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .message {
      padding: 28px 14px;
      text-align: center;
      color: var(--azul);
      font-weight: 700;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .app {
        padding: 6px 4px 76px;
      }

      .viewer {
        padding: 4px;
        border-radius: 14px;
      }

      .mini-controls {
        bottom: 8px;
        width: calc(100% - 12px);
        padding: 7px;
        gap: 6px;
      }

      .mini-controls button {
        padding: 8px 10px;
        font-size: 12px;
      }

      .page-info {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="viewer" id="viewer">
      <div class="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </section>

    <section class="mini-controls">
      <button id="prev">←</button>

      <span class="page-info">
        <span id="page_num">1</span> / <span id="page_count">...</span>
      </span>

      <button id="next">→</button>
      <button id="exitBtn" class="salir">Salir</button>
    </section>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const url = '7-bloqueos-gratuito-bases.pdf';
    const exitUrl = 'https://www.basesdelamusica.com/#materiales';

    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let currentScale = 1;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const viewer = document.getElementById('viewer');

    const pageNumEl = document.getElementById('page_num');
    const pageCountEl = document.getElementById('page_count');

    function calculateFitScale(page) {
      const baseViewport = page.getViewport({ scale: 1 });
      const availableWidth = viewer.clientWidth - 10;
      return availableWidth / baseViewport.width;
    }

    function renderPage(num) {
      pageRendering = true;

      pdfDoc.getPage(num).then((page) => {
        currentScale = calculateFitScale(page);

        const viewport = page.getViewport({ scale: currentScale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };

        page.render(renderContext).promise.then(() => {
          pageRendering = false;

          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });

        pageNumEl.textContent = num;
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    function previousPage() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitReader() {
      try {
        window.top.location.href = exitUrl;
      } catch (error) {
        window.location.href = exitUrl;
      }
    }

    document.getElementById('prev').addEventListener('click', previousPage);
    document.getElementById('next').addEventListener('click', nextPage);
    document.getElementById('exitBtn').addEventListener('click', exitReader);

    window.addEventListener('resize', () => {
      if (pdfDoc) {
        queueRenderPage(pageNum);
      }
    });

    pdfjsLib.getDocument(url).promise.then((pdfDoc_) => {
      pdfDoc = pdfDoc_;
      pageCountEl.textContent = pdfDoc.numPages;
      renderPage(pageNum);
    }).catch(() => {
      viewer.innerHTML =
        '<p class="message">No se pudo cargar el PDF. Revisa que el archivo se llame exactamente: 7-bloqueos-gratuito-bases.pdf</p>';
    });
  </script>
</body>
</html>
